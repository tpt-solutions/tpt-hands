[build]
target = "riscv32imafc-unknown-none-elf"

[target.riscv32imafc-unknown-none-elf]
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[env]
# espflash reports this board as chip revision v1.3. esp-hal 1.2 asserts at init
# when the chip is older than this minimum, and its default targets newer silicon.
ESP_HAL_CONFIG_MIN_CHIP_REVISION = "103"

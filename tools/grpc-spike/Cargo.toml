[package]
name = "grpc-spike"
description = "Phase 0 spike: tonic with a custom micropb codec, no prost"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false

[dependencies]
tpt-hands-proto = { path = "../../crates/tpt-hands-proto" }
micropb = { version = "0.6", default-features = false, features = ["encode", "decode", "enable-64bit", "alloc"] }
# Transport only. prost is left out on purpose, so the codec is ours.
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Serving without tonic's `router` feature, which needs axum and sync_wrapper.
# sync_wrapper is Apache-2.0 only, and the policy bans that. hyper is MIT.
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http2"] }

# Standalone on purpose. tonic 0.14 depends on sync_wrapper, which is
# Apache-2.0 only, and the workspace licence policy bans that. Keeping this out
# of the workspace keeps the main licence gate green. See todo.md, Phase 0.
[workspace]

[package]
name = "tpt-hands-grpc"
description = "gRPC over HTTP/2 for the Rust host, with micropb messages. Mirrors tpt-grpc-lite (Go)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-hands-proto = { path = "../tpt-hands-proto" }
micropb = { version = "0.6", default-features = false, features = ["encode", "decode", "enable-64bit", "alloc"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http2", "client-legacy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

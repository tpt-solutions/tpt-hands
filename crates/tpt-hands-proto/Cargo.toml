[package]
name = "tpt-hands-proto"
description = "Protobuf wire definitions for tpt-hands, shared with tpt-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["std"]
# `std` implies `alloc`, and adds the std::error::Error impl.
std = ["alloc"]
# Generated message types and the encoder. Needs a heap for Vec and String.
alloc = ["dep:micropb", "micropb/alloc"]

[dependencies]
# Frame format, from the tpt-link repo.
tpt-link.workspace = true
# Runtime for the code generated from proto/. MIT OR Apache-2.0.
micropb = { version = "0.6", default-features = false, features = ["encode", "decode", "enable-64bit"], optional = true }

[package]
name = "tpt-hands-proto"
description = "Protobuf wire definitions for tpt-hands, shared with tpt-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["std"]
# `std` implies `alloc`, and adds the std::error::Error impl.
std = ["alloc"]
# Enables the encoder, which needs a heap buffer.
alloc = []

[dependencies]

[package]
name = "tpt-hands-chrysalis-adapter"
description = "Sends MorphogenesisRequests to tpt-chrysalis over HTTP (proposed interface)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["http", "mock"]
# HTTP client for tpt-chrysalis, in `transport`. Turn it off for a pure mapping build.
http = ["dep:hyper", "dep:hyper-util", "dep:http", "dep:http-body-util", "dep:bytes", "dep:tokio"]
# MOCK of the proposed device-command interface, for tests and the integration
# crate. Not the real tpt-chrysalis.
mock = ["http"]

[dependencies]
tpt-hands-sdk = { version = "0.1.0", path = "../tpt-hands-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"], optional = true }
tokio = { version = "1", features = ["time", "net", "rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

# The transport tests use the mock, so they need that feature.
[[test]]
name = "transport"
required-features = ["mock"]

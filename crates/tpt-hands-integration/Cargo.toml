[package]
name = "tpt-hands-integration"
description = "End-to-end mock tests: simulated tear, edge reflex, chrysalis request and ack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-hands-sdk = { version = "0.1.0", path = "../tpt-hands-sdk" }
tpt-hands-edge = { version = "0.1.0", path = "../tpt-hands-edge" }
tpt-hands-chrysalis-adapter = { version = "0.1.0", path = "../tpt-hands-chrysalis-adapter" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

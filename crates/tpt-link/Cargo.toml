[package]
name = "tpt-link"
description = "Transports and link framing for tpt-hands (loopback, fault injection, heartbeat)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-hands-proto = { version = "0.1.0", path = "../tpt-hands-proto" }

[features]
# Serial and USB-CDC transport. Off by default. `serial2` is BSD-2-Clause OR
# Apache-2.0. `serialport` is MPL-2.0 and is not allowed.
serial = ["dep:serial2"]

[dependencies.serial2]
version = "0.2.38"
optional = true

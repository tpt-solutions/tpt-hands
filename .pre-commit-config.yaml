# Install: pip install pre-commit && pre-commit install
# Runs the same checks as CI. The tools must already be on PATH:
# cargo (with rustfmt and clippy), reuse, and go.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd go/tpt-hands-orchestrator && go vet ./...'
        language: system
        files: ^go/.*\.go$
        pass_filenames: false

      - id: reuse
        name: reuse lint
        entry: reuse lint
        language: system
        pass_filenames: false
        always_run: true

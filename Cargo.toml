[workspace]
resolver = "3"
members = [
    "crates/tpt-hands-sdk",
    "crates/tpt-hands-proto",
    "crates/tpt-hands-edge",
    "crates/tpt-hands-soma-adapter",
    "crates/tpt-hands-chrysalis-adapter",
    "tools/proto-gen",
    "crates/tpt-hands-handshake",
    "sim/morphogenesis_plugin",
    "crates/tpt-hands-grpc",
    "crates/tpt-hands-integration",
]

# tpt-link is its own repo on GitHub. Pinned to the v0.2.0 release commit. The
# tag itself is not pushed yet, so the commit is pinned instead. Builds need no
# sibling checkout.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }   # MIT OR Apache-2.0
serde_json = "1"                               # MIT OR Apache-2.0
tpt-link = { version = "0.2.0", git = "https://github.com/tpt-solutions/tpt-link", rev = "8e23498550578581b7d717a725f2571bbd15f8c5", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false

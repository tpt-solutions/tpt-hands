name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, so the pinned toolchain is used automatically.
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  proto:
    name: Generated protobuf code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Regenerate
        run: cargo run -q -p proto-gen
      - name: Fail if the committed code is stale
        run: git diff --exit-code -- crates/tpt-hands-proto/src/generated
      - name: Proto compatibility tests
        run: cd tools/proto-compat && python3 -m unittest test_proto_compat
      - name: Breaking-change check against the baseline
        run: python3 tools/proto-compat/proto_compat.py proto/baseline/tpt_hands.proto proto/tpt_hands.proto

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: go/tpt-hands-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tpt-hands-orchestrator/go.mod
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  go-grpc-lite:
    name: Go tpt-grpc-lite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: go/tpt-grpc-lite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tpt-grpc-lite/go.mod
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  licence:
    name: Licence and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: REUSE compliance
        run: |
          pip install reuse
          reuse lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tpt-grpc-lite/go.mod
      - name: Go licences (tpt-grpc-lite)
        working-directory: go/tpt-grpc-lite
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,ISC,Zlib,Unicode-3.0 --ignore github.com/tpt-solutions
      - name: Go licences (orchestrator)
        working-directory: go/tpt-hands-orchestrator
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,ISC,Zlib,Unicode-3.0 --ignore github.com/tpt-solutions
